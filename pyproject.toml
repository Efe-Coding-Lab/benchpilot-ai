[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchpilot-ai"
version = "0.1.0"
description = "Agentic validation automation for hardware test benches: anomaly detection, test-plan generation, PostgreSQL maintenance, and automated reporting."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Efe Kardes"}]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mcp = ["mcp>=2.0,<3"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = ["psycopg[binary]>=3.1", "mcp>=2.0,<3", "pytest>=8.0", "httpx>=0.27"]

[project.scripts]
benchpilot = "benchpilot_ai.cli:main"

[tool.setuptools]
packages = ["benchpilot_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
